[General]
; Master UI scale multiplier applied on top of automatic resolution scaling (default: 1.0).
; Example: 1.0 = match 1280x720 / 960x720 baseline; 1.25 = 25% larger UI overall.
UIScaleMultiplier=1.0

; Separate fine-tuning multipliers (multiplied with UIScaleMultiplier).
; MenuScaleMultiplier controls Inventory, Pause Menu, Shops, Map, Front-End, Dialogs, and Cursor.
; HUDScaleMultiplier controls Health/Stamina/XP bars, Minimap, Hotbars, Quest Tracker, Subtitles, and Tavern HUD.
MenuScaleMultiplier=1.0
HUDScaleMultiplier=1.0

[Behavior]
; 1 = automatically scale UI proportionally to resolution using ReferenceHeight.
; 0 = ignore resolution and scale strictly by the multipliers above.
AutoScaleWithResolution=1

; Target vertical resolution whose UI size is matched across higher resolutions (default: 720.0).
ReferenceHeight=720.0

; 1 = allow shrinking on resolutions below ReferenceHeight (like vanilla); 0 = clamp scale >= 1.0.
AllowDownscale=1

; 1 = also scale the Front-End / Main Menu screens; 0 = keep Main Menu unscaled.
ScaleMainMenu=1

; 1 = enable bilinear filtering on HUD sprites when HUD scale != 1.0 (smoother at 1080p 1.5x); 0 = nearest-neighbor.
FilterScaledSprites=1
